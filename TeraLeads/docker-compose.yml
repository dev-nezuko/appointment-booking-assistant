services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chatbot_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./chatbot-backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./chatbot-backend/src/database/indexing.sql:/docker-entrypoint-initdb.d/02-indexing.sql
      - ./chatbot-backend/src/database/data.sql:/docker-entrypoint-initdb.d/03-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network

  ai-service:
    build:
      context: ./chatbot-ai
      dockerfile: Dockerfile
    environment:
      # auto: use a hosted model when its key is set, the local
      # rule-based model when it is not. A clone with no keys runs.
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=${NODE_ENV:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3400}
    volumes:
      # The assistant's own JSON record of bookings and conversation logs
      - ai_data:/app/data
    ports:
      - "${AI_PORT:-8400}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatbot-network
    restart: unless-stopped

  backend:
    build:
      context: ./chatbot-backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chatbot_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - AI_SERVICE_URL=http://ai-service:8000
      # Must match FRONTEND_PORT: the browser sends that origin.
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3400}
    ports:
      - "${BACKEND_PORT:-3401}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chatbot-network
    restart: unless-stopped

  frontend:
    build:
      context: ./chatbot-frontend
      dockerfile: Dockerfile
      args:
        # Must match the host port the backend is published on, because the
        # browser — not the container — makes these calls.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3401}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3401}
    ports:
      - "${FRONTEND_PORT:-3400}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped

volumes:
  postgres_data:
  ai_data:

networks:
  chatbot-network:

