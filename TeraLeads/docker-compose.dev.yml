# Hot-reload override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Each service runs its dev server against the source mounted from the host.

services:
  frontend:
    build:
      target: deps
    volumes:
      - ./chatbot-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3401}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:3401}
    command: npx next dev --hostname 0.0.0.0 --port 3000
    healthcheck:
      disable: true

  backend:
    build:
      target: dev
    volumes:
      - ./chatbot-backend/src:/app/src
    environment:
      - NODE_ENV=development
    command: npm run dev

  ai-service:
    volumes:
      - ./chatbot-ai/src:/app/src
    environment:
      - ENVIRONMENT=development
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
